<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            background-color: rgb(15, 190, 132);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-areas: 
            "box1 box1 box2 box2"
            "box3 box4 box4 box4"
            "box5 box5 box5 box5";
        }
        section div{
            border: 1px solid;
        }
    </style>
</head>
<body>
    <section>
        <div style="grid-area: box1;">1</div>
        <div style="grid-area: box2;">2</div>
        <div style="grid-area: box3;">3</div>
        <div style="grid-area: box4;">4</div>
        <div style="grid-area: box5;">5</div>
    </section>
</body>
</html>
