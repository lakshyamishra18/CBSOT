<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            background-color: yellow;
            display: grid;
            gap: 1rem;
            padding: 1rem;
            grid-template-columns: 1fr 2fr 2fr ;
            grid-template-rows: 1fr 1fr;
        }
        section div{
            border: 1px solid;
        }
    </style>
</head>
<body>
    <h2>Task 1</h2>
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </section>
</body>
</html>
