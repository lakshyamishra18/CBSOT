<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Html Forms</h1>
    <form>
        <fieldset style="width: 20%; margin: auto;">
            <legend>Fill the form</legend>
            <label for="Username">Username:</label>
            <input id="Username" name="Username" value="" placeholder="Enter Username" type="text" required>
            <br>
            <br>
            
            <label for="Age">Age:</label>
        
            <input id="Age" name="Age" value="" placeholder="Enter Age" type="number" required>
            <br>
            <br>
            
            <label for="Email">Email:</label>
            <input id="Email" name="Email" value="" placeholder="Enter Email" type="email" required>
            <br>
            <br>
            
            <label for="Password">Password:</label>
            <input id="Password" name="Password" value="" placeholder="Enter Password" type="password" required>
            <br>
            <br>
            
            <label for="DOB">Date of Birth:</label>
            <input id="DOB" name="DOB" value="" placeholder="Enter Date of Birth" type="date" required>
            <br>
            <br>
            
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender"" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender"" value="female" required>
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender"" value="other" required>
            <label for="other">Other</label>
            <br>
            <br>
            
            <label for="Choose">Choose an option:</label>
            <select id="Choose" name="Choose">
                <option value="">Select an option</option>
                <option value="Option 1">Html</option>
                <option value="Option 2">Css</option>
                <option value="Option 3">JavaScript</option>
            </select>
            <br>
            <br>
            
            <input type="checkbox" id="checkbox" name="checkbox" value="checkbox" required>
            <label for="checkbox">I agree to the terms and conditions</label>
            <br>
            <br>
            
            <input type="file" id="file" name="file" >
            <br>
            <br>
            
            <input type="hidden" id="hidden" name="hidden" value="hidden">
            <br>
            <br>
            
            <label>Choose a browser from the list:</label>
            <input list="browser" name="browser">
            <datalist id="browser">
                <option value="Chrome">
                <option value="Firefox">
                <option value="Safari">
                <option value="Edge">
                <option value="Opera">
            </datalist>
            <br>
            <br>
                                
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
